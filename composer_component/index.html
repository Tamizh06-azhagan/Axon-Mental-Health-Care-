<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ink: #1B133C; --card: #FFFFFF; --accent: #6D5BD0;
    --btn: #1B133C; --btn2: #2D2456; --danger: #C2410C;
    --line: rgba(27,19,60,.12); --ink2: rgba(27,19,60,.62); --ink3: rgba(27,19,60,.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif; color: var(--ink);
  }
  body { padding: 2px 4px 12px; }

  .box {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    padding: 10px 12px 8px;
    box-shadow: 0 10px 30px -18px rgba(27,19,60,.35);
    transition: border-color .2s, box-shadow .2s;
  }
  .box:focus-within {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent),
                0 10px 30px -18px rgba(27,19,60,.35);
  }
  .box.recording {
    border-color: color-mix(in srgb, var(--danger) 55%, transparent);
    box-shadow: 0 0 0 3px rgba(194,65,12,.12), 0 10px 30px -18px rgba(27,19,60,.35);
  }

  textarea {
    display: block; width: 100%; min-height: 34px; max-height: 160px;
    border: 0; outline: 0; resize: none; background: transparent;
    font: inherit; font-size: 15px; line-height: 1.5; color: var(--ink);
    padding: 6px 4px; overflow-y: auto;
  }
  textarea::placeholder { color: var(--ink3); }
  .box.recording textarea { display: none; }

  .rec-row { display: none; align-items: center; gap: 10px; height: 40px; padding: 0 4px; }
  .box.recording .rec-row { display: flex; }
  .dot {
    flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(194,65,12,.45); }
    70% { box-shadow: 0 0 0 9px rgba(194,65,12,0); }
    100% { box-shadow: 0 0 0 0 rgba(194,65,12,0); }
  }
  .timer { flex: none; min-width: 36px; font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums; }
  .wave { flex: 1; min-width: 0; height: 30px; display: flex; align-items: center;
    justify-content: center; gap: 3px; overflow: hidden; }
  .wave span { width: 3px; height: 4px; border-radius: 9px;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 45%, transparent)); }

  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .group { display: flex; align-items: center; gap: 2px; }

  .icon {
    flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; background: transparent; color: var(--ink2);
    transition: background .15s, color .15s, transform .15s;
  }
  .icon:active { transform: scale(.92); }
  .icon:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }

  .cancel { display: none; color: var(--danger); }
  .cancel:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .box.recording .cancel { display: grid; }
  .box.recording .mic { display: none; }

  .send { background: color-mix(in srgb, var(--ink) 16%, transparent); color: #FFFFFF; }
  .send:hover:not(:disabled) { background: var(--btn2); }
  .send:not(:disabled) { background: var(--btn); }
  .send:disabled { cursor: default; }
  .send.stop { background: var(--danger); }
  .send.stop:hover { filter: brightness(1.08); }
  svg { display: block; }
</style>
</head>
<body>
<div class="box" id="box">
  <textarea id="text" rows="1" placeholder="Write what's on your mind" aria-label="Message"></textarea>

  <div class="rec-row">
    <span class="dot"></span>
    <span class="timer" id="timer">0:00</span>
    <div class="wave" id="wave"></div>
  </div>

  <div class="bottom">
    <div class="group">
      <button class="icon mic" id="mic" aria-label="Record a voice message" title="Record a voice message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
      </button>
      <button class="icon cancel" id="cancel" aria-label="Cancel recording" title="Cancel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="icon send" id="send" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const box = $('box'), ta = $('text'), sendBtn = $('send'), micBtn = $('mic');
  const cancelBtn = $('cancel'), timer = $('timer'), wave = $('wave');
  const MAX_SECS = 60, MAX_BYTES = 5 * 1024 * 1024;
  const DEFAULT_PLACEHOLDER = "Write what's on your mind";

  let placeholder = DEFAULT_PLACEHOLDER;
  let stream = null, recorder = null, chunks = [], mime = 'audio/webm';
  let ctx = null, analyser = null, raf = null, tick = null, t0 = 0, dropRec = false;
  let recording = false, flashTimer = null;

  // Bars for the live waveform
  const bars = [];
  for (let i = 0; i < 26; i++) { const s = document.createElement('span'); wave.appendChild(s); bars.push(s); }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  // Streamlit component protocol
  const post = (type, data = {}) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*');
  const sendValue = value => post('streamlit:setComponentValue', { value, dataType: 'json' });
  const reportHeight = () => post('streamlit:setFrameHeight', { height: Math.ceil(box.offsetHeight) + 14 });

  // Keep the iframe exactly as tall as the box, so no empty space is left below the composer
  new ResizeObserver(reportHeight).observe(box);

  function applyTheme(t) {
    if (!t) return;
    const s = document.documentElement.style;
    s.setProperty('--ink', t.ink);
    s.setProperty('--card', t.card);
    s.setProperty('--accent', t.accent);
    s.setProperty('--btn', t.btn);
    s.setProperty('--btn2', `color-mix(in srgb, ${t.btn} 82%, white)`);
    s.setProperty('--line', `color-mix(in srgb, ${t.ink} 12%, transparent)`);
    s.setProperty('--ink2', `color-mix(in srgb, ${t.ink} 62%, transparent)`);
    s.setProperty('--ink3', `color-mix(in srgb, ${t.ink} 40%, transparent)`);
    document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
  }

  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'streamlit:render') return;
    const args = e.data.args || {};
    applyTheme(args.theme);
    if (args.placeholder && args.placeholder !== placeholder) {
      placeholder = args.placeholder;
      ta.placeholder = placeholder;
    }
    reportHeight();
  });
  post('streamlit:componentReady', { apiVersion: 1 });

  // Button state: send when there is text, stop when recording
  function refreshSend() {
    if (recording) {
      sendBtn.disabled = false;
      sendBtn.classList.add('stop');
      sendBtn.setAttribute('aria-label', 'Send voice message');
    } else {
      sendBtn.disabled = !ta.value.trim();
      sendBtn.classList.remove('stop');
      sendBtn.setAttribute('aria-label', 'Send');
    }
  }

  // Auto-grow textarea
  function grow() {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  }

  function sendText() {
    const text = ta.value.trim();
    if (!text) return;
    sendValue({ id: uid(), kind: 'text', text });
    ta.value = '';
    grow();
    refreshSend();
  }

  ta.addEventListener('input', () => { grow(); refreshSend(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });

  sendBtn.addEventListener('click', () => {
    if (recording) stopRec(false);
    else sendText();
  });

  // Voice
  function flash(message) {
    ta.placeholder = message;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { ta.placeholder = placeholder; }, 2600);
  }

  function drawWave() {
    if (!analyser) return;
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
    const level = Math.min(1, Math.sqrt(sum / buf.length) * 5);
    const now = Date.now();
    bars.forEach((b, i) => {
      const wobble = 0.55 + 0.45 * Math.sin(now / 110 + i * 0.6);
      b.style.height = (4 + level * wobble * 26) + 'px';
    });
    raf = requestAnimationFrame(drawWave);
  }

  async function startRec() {
    if (recording) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      flash('Voice recording is not supported in this browser');
      return;
    }
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      flash('Allow microphone access to record');
      return;
    }

    stream = s;
    chunks = [];
    dropRec = false;
    const pref = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
      .find(t => MediaRecorder.isTypeSupported(t));
    mime = pref ? pref.split(';')[0] : 'audio/webm';

    recorder = new MediaRecorder(stream, pref ? { mimeType: pref } : undefined);
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRec;
    recorder.start(250);

    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(analyser);

    recording = true;
    t0 = Date.now();
    timer.textContent = '0:00';
    box.classList.add('recording');
    refreshSend();
    tick = setInterval(() => {
      const secs = Math.floor((Date.now() - t0) / 1000);
      timer.textContent = fmt(secs);
      if (secs >= MAX_SECS) stopRec(false);
    }, 200);
    drawWave();
  }

  function stopRec(drop) {
    if (!recorder || recorder.state === 'inactive') return;
    dropRec = drop;
    clearInterval(tick);
    cancelAnimationFrame(raf);
    recorder.stop();
  }

  function finishRec() {
    const secs = Math.round((Date.now() - t0) / 1000);
    const blob = new Blob(chunks, { type: mime });

    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close().catch(() => {});
    stream = null; ctx = null; analyser = null; recorder = null; chunks = [];
    recording = false;
    box.classList.remove('recording');
    refreshSend();

    if (dropRec) return;
    if (secs < 1 || blob.size < 800) { flash('Hold a little longer to record'); return; }
    if (blob.size > MAX_BYTES) { flash('That voice message is too long'); return; }

    const reader = new FileReader();
    reader.onload = () => {
      const audio = String(reader.result).split(',')[1];
      sendValue({ id: uid(), kind: 'audio', audio, mime, secs });
    };
    reader.readAsDataURL(blob);
  }

  micBtn.addEventListener('click', startRec);
  cancelBtn.addEventListener('click', () => stopRec(true));

  refreshSend();
  reportHeight();
})();
</script>
</body>
</html>
